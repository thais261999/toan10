<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lớp Toán 10 - Thầy Thái</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tải Firebase SDK an toàn -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="cauhoi.js"></script>
</head>
<body class="bg-light">

  <!-- Màn hình 1: Đăng nhập Google -->
  <div id="login-screen" class="container text-center py-5">
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 400px; border-radius: 12px;">
      <h3 class="mb-3 fw-bold text-primary">Lớp Toán 10 - Thầy Thái</h3>
      <p class="text-muted mb-4">Vui lòng đăng nhập Google để vào học.</p>
      <button onclick="dangNhapGoogle()" class="btn btn-danger btn-lg w-100 fw-bold">
        Đăng nhập bằng Google
      </button>
    </div>
  </div>

  <!-- Màn hình 2: Đang chờ duyệt -->
  <div id="pending-screen" class="container text-center py-5 d-none">
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 450px; border-radius: 12px;">
      <div class="fs-1 mb-2">🦉</div>
      <h4 class="fw-bold mb-2">Đang chờ duyệt</h4>
      <p class="text-muted">Tài khoản của bạn đang chờ thầy Thái duyệt.</p>
      <button onclick="location.reload()" class="btn btn-primary mb-2">Kiểm tra lại</button>
      <div><a href="#" onclick="dangXuat()" class="text-decoration-none text-muted small">Đăng nhập tài khoản khác</a></div>
    </div>
  </div>

  <!-- Màn hình 3: Nội dung chính -->
  <div id="main-app" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Toán 10 - Thầy Thái</a>
        <div id="user-info" class="text-white d-flex align-items-center"></div>
      </div>
    </nav>
    <div class="container">
      <h3 class="mb-3">Ngân Hàng Câu Hỏi & Luyện Tập</h3>
      <div id="quiz-container"></div>
    </div>
  </div>

  <!-- Script xử lý Auth an toàn -->
  <script src="fb.js"></script>
</body>
</html>
