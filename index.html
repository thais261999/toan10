<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- ===== Khai báo để cài được vào màn hình chính điện thoại ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5a4fe0">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Toán 10">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Toán 10 – Chương trình GDPT 2018</title>
  <meta name="description" content="Lộ trình tự học Toán lớp 10 theo Chương trình GDPT 2018. Mỗi chương năm chặng, làm từng câu một, biết đúng sai ngay.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="wrap top__inner">
    <a href="#" class="brand" id="brandHome">
      <span class="brand__mark">10</span>
      <span class="brand__text">
        <strong>Toán lớp 10</strong>
        <small>Mỗi ngày một chút - mỗi lúc một giỏi.</small>
      </span>
    </a>
    <div class="top__nut">
      <div class="cuhop" id="cuTop" title="Bạn đồng hành"></div>
      <button class="tron" id="btnMoKhoa" title="Mở khoá mọi chặng, dành cho giáo viên">🔓</button>
      <button class="tron" id="btnReset" title="Xoá toàn bộ tiến độ trên máy này">↺</button>
    </div>
  </div>
</header>

<!-- ============================================================
     LỘ TRÌNH: 9 chương, mỗi chương 5 chặng
     ============================================================ -->
<main class="wrap" id="viewList">

  <div class="duong" id="duong"><!-- JS sinh lộ trình ở đây --></div>
</main>

<!-- ============================================================
     MÀN LÀM BÀI: toàn màn hình, mỗi lần một câu
     ============================================================ -->
<section class="hoc" id="hoc" hidden>
  <header class="hoc__top">
    <button class="hoc__dong" id="hocDong" aria-label="Thoát">✕</button>
    <div class="thanh"><i id="thanhDay"></i></div>
    <span class="hoc__dem" id="hocDem"></span>
  </header>

  <div class="hoc__than">
    <div class="hoc__trong">
      <div id="hocThan"></div>
    </div>
  </div>

  <footer class="hoc__chan" id="hocChan">
    <div class="hoc__trong">
      <div class="phanhoi" id="phanhoi" hidden>
        <div class="cuhop cuhop--vua" id="cuPhanHoi"></div>
        <div class="phanhoi__chu">
          <b id="phanhoiTieu"></b>
          <p id="phanhoiGiai"></p>
        </div>
      </div>
      <button class="solid btn--lg btn--block" id="hocNut">Kiểm tra</button>
    </div>
  </footer>
</section>

<!-- Màn tổng kết sau mỗi chặng -->
<div class="mung" id="mung" hidden>
  <div class="mung__hop">
    <div class="mung__phao" id="mungPhao"></div>
    <div class="cuhop cuhop--to" id="cuMung"></div>
    <h2 id="mungTieu">Qua chặng!</h2>
    <p id="mungTen"></p>
    <p class="mung__phu" id="mungPhu"></p>
    <button class="solid" id="mungOk">Tiếp tục</button>
  </div>
</div>

<div class="phao" id="phaoHoc" aria-hidden="true"></div>

<!-- MathJax: dịch LaTeX trong js/data.js thành công thức toán -->
<script>
  window.MathJax = {
    tex: {
      inlineMath:  [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<script src="js/data.js"></script>
<script src="js/main.js"></script>

<!-- Bật chế độ chạy ngoại tuyến. Chỉ hoạt động khi trang đã đưa lên mạng (https), không chạy khi mở file trực tiếp. -->
<script>
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
