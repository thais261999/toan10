<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lớp Toán 10 - Thầy Thái</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="cauhoi.js"></script>
</head>
<body class="bg-light">

  <!-- Màn hình 1: Nhập Tên & Lớp -->
  <div id="login-screen" class="container text-center py-5">
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 400px; border-radius: 12px;">
      <h3 class="mb-3 fw-bold text-primary">Lớp Toán 10 - Thầy Thái</h3>
      <p class="text-muted mb-3">Nhập thông tin để đăng ký học (Chỉ làm 1 lần)</p>
      
      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Họ và tên học sinh:</label>
        <input type="text" id="student-name" class="form-control form-control-lg" placeholder="Ví dụ: Nguyễn Văn A">
      </div>
      
      <div class="mb-4 text-start">
        <label class="form-label fw-bold">Lớp:</label>
        <input type="text" id="student-class" class="form-control form-control-lg" placeholder="Ví dụ: 10A1">
      </div>

      <button onclick="xacNhanHocSinh()" class="btn btn-primary btn-lg w-100 fw-bold">
        🚀 Gửi Đăng Ký
      </button>
    </div>
  </div>

  <!-- Màn hình 2: Đang chờ duyệt -->
  <div id="pending-screen" class="container text-center py-5 d-none">
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 450px; border-radius: 12px;">
      <div class="fs-1 mb-2">🦉</div>
      <h4 class="fw-bold mb-2">Đang chờ thầy duyệt</h4>
      <p class="text-muted">Tài khoản của bạn đã gửi thành công. Vui lòng chờ thầy Thái phê duyệt để vào học!</p>
      <button onclick="kiemTraLai()" class="btn btn-primary mb-2">Kiểm tra lại</button>
      <div><a href="#" onclick="doiTaiKhoan()" class="text-decoration-none text-muted small">Đổi thông tin khác</a></div>
    </div>
  </div>

  <!-- Màn hình 3: Nội dung chính -->
  <div id="main-app" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Toán 10 - Thầy Thái</a>
        <div id="user-info" class="text-white d-flex align-items-center"></div>
      </div>
    </nav>
    <div class="container">
      <h3 class="mb-3">Ngân Hàng Câu Hỏi & Luyện Tập</h3>
      <div id="quiz-container"></div>
    </div>
  </div>

  <script src="fb.js"></script>
</body>
</html>
